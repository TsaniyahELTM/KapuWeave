<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KapuWeave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#FFF9EC;--card:#fff;--ink:#2D3A3A;--mute:#5E6E6E;--teal:#0F9D9A;--teal-d:#0B7774;--yel:#F6C945;--ok:#1B8A4B;--okbg:#E4F5EA;--bad:#B93A2E;--badbg:#FCE9E6;--line:#E6DCC3;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#172323;--card:#223131;--ink:#F3EFE2;--mute:#A9B8B6;--teal:#22B5B1;--teal-d:#2CC9C4;--ok:#6FD79A;--okbg:#1E3A2B;--bad:#FF9A8D;--badbg:#3F2724;--line:#365050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#172323;--card:#223131;--ink:#F3EFE2;--mute:#A9B8B6;--teal:#22B5B1;--teal-d:#2CC9C4;--ok:#6FD79A;--okbg:#1E3A2B;--bad:#FF9A8D;--badbg:#3F2724;--line:#365050;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Nunito,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.15;margin:0 0 8px}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-family:"Baloo 2";font-weight:700;font-size:20px;color:var(--teal)}
.link{background:none;border:0;color:var(--teal-d);font:600 15px Nunito;text-decoration:underline;padding:8px 0;cursor:pointer}
.kapu{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px}
.kapu img{flex:none;height:64px;width:auto}
.bub{background:var(--card);border:2px solid var(--yel);border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--teal);background:var(--teal);color:#fff;font:700 17px Nunito;text-align:left;cursor:pointer;margin-bottom:10px}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.alt:hover:not(:disabled){border-color:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.c{text-align:center}
.btn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.btn.no{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.pair p{margin:0 0 8px;padding:10px 12px;border-left:4px solid var(--yel);background:var(--bg);border-radius:0 10px 10px 0}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--teal)}
.lv{display:flex;gap:12px;align-items:center}
.lv b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 18px "Baloo 2"}
.lv.lock b{background:var(--line);color:var(--mute)}
.lv.lock{opacity:.7}
.lv.done b{background:var(--ok);color:var(--bg)}
.mute{color:var(--mute);font-size:15px}
.slot{display:block;width:100%;border:2px dashed var(--teal);background:none;color:var(--teal-d);border-radius:12px;padding:8px;font:700 16px Nunito;margin:6px 0;cursor:pointer}
.slot.f{border-style:solid;background:var(--yel);color:#2D3A3A;border-color:var(--yel)}
.slot.sel{outline:3px solid var(--teal)}
.pos{display:flex;gap:8px;align-items:stretch;margin:0}
.pos>span{flex:none;width:30px;height:auto;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 16px "Baloo 2"}
.pos>button{flex:1;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:600 16px Nunito;cursor:pointer}
.pos.empty>button{border-style:dashed;color:var(--mute);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--teal);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:700 16px Nunito;cursor:pointer}
.res{display:flex;gap:10px;margin:0 0 10px;padding:10px 12px;border-radius:12px}
.res.ok{background:var(--okbg)}.res.no{background:var(--badbg)}
.res b{flex:none}
.para{font-size:18px;line-height:1.6;border-left:4px solid var(--teal);padding-left:12px}
.tag{display:inline-block;padding:4px 12px;border-radius:14px;margin:0 6px 6px 0;font-weight:700;font-size:15px}
.tag.m{background:var(--okbg);color:var(--ok)}.tag.p{background:var(--yel);color:#2D3A3A}
@media (prefers-reduced-motion:no-preference){.bub{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.5}}}
.hero{text-align:center;margin-bottom:12px}.hero img{height:120px;width:auto}.tag.n{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
</style>
</head>

 let h=hdr();const tp=T();
 if(S.scr==="start"){
  h+=`<div class="hero"><h1>KapuWeave</h1><p class="mute" style="margin:0 0 14px">Weave ideas into clear paragraphs, with a Pontianak touch.</p><img src="${KIMG.h}" alt="Kapu" height="120"></div>`+K("Hi, I\u2019m Kapu! I\u2019ll be your guide as we weave ideas into clear paragraphs. Ready to start?","happy")+`<button class="btn c" data-a="begin">Start weaving</button>`;
 }else if(S.scr==="topic"){
  h+=K("Pick a topic before we start weaving!")+TOPICS.map((t,i)=>`<button class="btn" data-a="topic" data-v="${i}">${t.t}</button>`).join("");
 }else if(S.scr==="read"){
  h+=K("Read carefully. Everything you practice comes from this text.")+`<div class="card"><h3>${tp.t}</h3><p style="margin:0">${tp.x.join(" ")}</p></div><button class="btn c" data-a="levels">Go to levels</button>`;
 }else if(S.scr==="levels"){
  const n=S.done.length,lv=[["Recognize","Spot how two sentences relate."],["Connect","Pick the connector that fits the gap."],["Build","Arrange ideas and connectors into a paragraph."]];
  h+=K(n===3?"All three levels done. Great weaving!":"Finish each level correctly to unlock the next one.")+`<div class="prog"><i style="width:${n/3*100}%"></i></div>`;
  lv.forEach((l,i)=>{const lock=i+1>S.unlocked,dn=S.done.includes(i+1);
   h+=`<button class="btn alt lv ${lock?"lock":""} ${dn?"done":""}" ${lock?"disabled":""} data-a="lv" data-v="${i+1}"><b>${lock?"\u{1F512}":dn?"\u2713":i+1}</b><span><strong>Level ${i+1}: ${l[0]}</strong><br><span class="mute">${l[1]}</span></span></button>`});
  if(n===3)h+=`<button class="btn c" data-a="sum">See summary</button>`;
 }else if(S.scr==="q1"||S.scr==="q2"){
  const lv=S.scr==="q1"?1:2,L=lv===1?tp.l1:tp.l2,q=L[S.q],opts=lv===1?q[2]:q[2],ans=q[3];
  h+=`<h2>Level ${lv}: ${lv===1?"Recognize":"Connect"} <span class="mute">(${S.q+1}/${L.length})</span></h2>`;
  h+=K(S.ok?"Great job! Read why below.":(S.picked.length?"Not quite. Read the hint and try again.":(lv===1?"How are these two sentences related?":"Which connector fits the gap?")));
  if(lv===1)h+=`<div class="card pair"><p>${q[0]}</p><p>${q[1]}</p></div>`;
  else{const gap=S.ok?`<strong>${opts[ans]}${q[4]?"":","}</strong>`:`<strong>______${q[4]?"":","}</strong>`;h+=`<div class="card"><p style="margin:0">${q[0]} ${gap} ${q[1]}</p></div>`}
  opts.forEach((o,i)=>{const p=S.picked.includes(i),cls=S.ok&&i===ans?"ok":p?"no":"alt";
   h+=`<button class="btn ${cls}" data-a="ans" data-v="${i}" ${p||S.ok?"disabled":""}>${o}${S.ok&&i===ans?" \u2713":p?" \u2717":""}</button>`});
  if(S.picked.length&&!S.ok)h+=`<div class="res no"><b>\u2717</b><span>${hint(opts[S.picked[S.picked.length-1]])}</span></div><p class="mute" style="margin:0 0 12px"><strong>Try again:</strong> choose another answer.</p>`;
  if(S.ok)h+=`<div class="res ok"><b>\u2713</b><span>${why(opts[ans])}</span></div><button class="btn c" data-a="next">${S.q+1<L.length?"Next question":"Finish level"}</button>`;
 }else if(S.scr==="build"){
  const ideas=tp.l3[0],conns=tp.l3[1];
  h+=`<h2>Level 3: Build</h2>`+K("Tap the idea cards in order, then tap a gap to choose a connector.");
  const free=SHUF.filter(i=>!S.ord.includes(i));
  h+=`<div class="card"><h3>Idea cards</h3>`+(free.length?free.map(i=>`<button class="btn alt" data-a="put" data-v="${i}">${ideas[i]}</button>`).join(""):`<p class="mute" style="margin:0">All cards placed. Tap a card below to take it back.</p>`)+`</div><div class="card"><h3>Your paragraph</h3>`;
  for(let p=0;p<4;p++){const id=S.ord[p];
   h+=`<div class="pos ${id===undefined?"empty":""}"><span>${p+1}</span><button data-a="rm" data-v="${p}">${id===undefined?"Tap a card above":ideas[id]}</button></div>`;
   if(p<3)h+=`<button class="slot ${S.slots[p]?"f":""} ${S.sel===p?"sel":""}" data-a="slot" data-v="${p}">${S.slots[p]||"Tap to choose a connector"}</button>`}
  h+=`</div>`;
  if(S.sel!==null)h+=`<div class="card"><h3>Connector for gap ${S.sel+1}</h3><div class="chips">${conns.map(c=>`<button class="chip" data-a="chip" data-v="${c}">${c}</button>`).join("")}</div></div>`;
  h+=`<button class="btn c" data-a="check" ${S.ord.length===4&&S.slots.every(Boolean)?"":"disabled"}>Check</button>`;
 }else if(S.scr==="fb"){
  const f=S.fb,conns=tp.l3[1];
  h+=`<h2>Feedback</h2>`+K(f.all?"Perfect! Your paragraph reads clearly.":"Good try. Let\u2019s see how each part reads.");
  h+=`<div class="res ${f.orderOk?"ok":"no"}"><b>${f.orderOk?"\u2713":"\u2717"}</b><span>${f.orderOk?"Your idea order works.":"Check the order of your cards. "+f.orderHint}</span></div>`;
  f.slots.forEach((r,i)=>{const e=conns[i],w=`Card ${i+2} ${REL[fn(e)]}${fn(e)==="conclusion"?"":" "+(i+1)}, so \u201C${e}\u201D (${fn(e)}) fits.`;
   h+=`<div class="res ${r.ok?"ok":"no"}"><b>${r.ok?"\u2713":"\u2717"}</b><span><strong>${r.c}</strong>: ${r.ok?w:"does not fit here. "+w}</span></div>`});
  h+=f.all?`<button class="btn c" data-a="done3">See summary</button>`:`<button class="btn c" data-a="revise">Revise</button>`;
 }else if(S.scr==="sum"){
  const c=tp.l3[1],d=tp.l3[0],para=`${d[0]} ${c[0]}, ${lf(d[1])} ${c[1]}, ${lf(d[2])} ${c[2]}, ${lf(d[3])}`;
  const m=[...S.used].filter(x=>!S.bad.has(x)),p=[...S.bad];
  h+=`<h2>Summary</h2>`+K("Nice work! Here is your finished paragraph.")+`<div class="card"><p class="para" style="margin:0">${para}</p></div><div class="card"><h3>Mastered</h3>${m.length?m.map(x=>`<span class="tag m">${x}</span>`).join(""):'<p class="mute" style="margin:0">None yet. Keep practicing!</p>'}<h3 style="margin-top:12px">Practice again</h3>${p.length?p.map(x=>`<span class="tag p">${x}</span>`).join(""):'<p class="mute" style="margin:0">Nothing to review. Well done!</p>'}</div><button class="btn c" data-a="again">Practice again</button><button class="btn alt c" data-a="newtopic">New topic</button>`;
 }else if(S.scr==="book"){
  h+=`<h2>Connector Book</h2>`+K("Connectors that tripped you up are highlighted. Review them by function.");
  Object.keys(INFO).forEach(f=>{const list=Object.keys(FN).filter(c=>FN[c]===f);
   h+=`<div class="card"><h3>${INFO[f].n}</h3><p class="mute" style="margin:0 0 8px">${INFO[f].ex}</p>${list.map(c=>`<span class="tag ${book.includes(c)?"p":"n"}">${c}</span>`).join("")}</div>`});
  h+=`<button class="btn c" data-a="back">Back</button>`;
 }
 $.innerHTML=h;
}
$.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,tp=T();
 if(a==="begin")go("topic");
 else if(a==="topic"){S=Object.assign({scr:"read",ti:+v,prev:S.prev},fresh());render();window.scrollTo(0,0)}
 else if(a==="levels")go("levels");
 else if(a==="lv"){S.q=0;S.picked=[];S.ok=false;if(v==="3"){S.ord=[];S.slots=[null,null,null];S.sel=null;go("build")}else go("q"+v)}
 else if(a==="ans"){
  const i=+v,lv=S.scr==="q1"?1:2,q=(lv===1?tp.l1:tp.l2)[S.q],c=q[2][i];
  if(i===q[3]){S.ok=true;if(lv===2)S.used.add(cap(c))}
  else{S.picked.push(i);if(lv===2){S.bad.add(cap(c));addBook(c)}}
  render()}
 else if(a==="next"){
  const lv=S.scr==="q1"?1:2,L=lv===1?tp.l1:tp.l2;
  if(S.q+1<L.length){S.q++;S.picked=[];S.ok=false;render();window.scrollTo(0,0)}
  else{if(!S.done.includes(lv))S.done.push(lv);S.unlocked=Math.max(S.unlocked,lv+1);go("levels")}}
 else if(a==="put"){if(S.ord.length<4){S.ord.push(+v);render()}}
 else if(a==="rm"){const p=+v;if(S.ord[p]!==undefined){S.ord.splice(p,1);render()}}
 else if(a==="slot"){S.sel=S.sel===+v?null:+v;render()}
 else if(a==="chip"){S.slots=S.slots.map(c=>c===v?null:c);S.slots[S.sel]=v;S.sel=null;render()}
 else if(a==="check"){
  const conns=tp.l3[1],orderOk=S.ord.every((id,p)=>id===p),slots=S.slots.map((c,i)=>({c,ok:c===conns[i]}));
  slots.forEach(r=>{S.used.add(cap(r.c));if(!r.ok){S.bad.add(cap(r.c));addBook(r.c)}});
  const wp=S.ord.findIndex((id,p)=>id!==p);
  S.fb={orderOk,orderHint:wp>=0?`Position ${wp+1}: ${ORDH[wp]}`:"",slots,all:orderOk&&slots.every(r=>r.ok)};
  go("fb")}
 else if(a==="revise")go("build");
 else if(a==="done3"){if(!S.done.includes(3))S.done.push(3);go("sum")}
 else if(a==="sum")go("sum");
 else if(a==="again"){const ti=S.ti;S=Object.assign({scr:"levels",ti,prev:S.prev},fresh());render();window.scrollTo(0,0)}
 else if(a==="newtopic")go("topic");
 else if(a==="book"){if(S.scr!=="book")S.prev=S.scr;go("book")}
 else if(a==="back")go(S.prev||"topic");
 else if(a==="goback")go(BK.back[S.scr]);
});
render();
</script>
